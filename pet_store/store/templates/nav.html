{% extends 'base.html'%} 

{% block content %}

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container px-4 px-lg-5">
        <a class="navbar-brand" href="{% url 'home' %}">Petty</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                
                {% if  user.is_authenticated %}

                <li class="nav-item"><a class="nav-link" href="{% url 'Logout' %}">Logout</a></li>

                {% else %}
                <li class="nav-item"><a class="nav-link" href="{% url 'Login' %}">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'Signup' %}">Signup</a></li>

                {% endif %}

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">category</a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        {% for category in categories %}
                        <li><a class="dropdown-item" href="{% url 'category' category.id %}">{{ category.name }}</a></li>
                        <li><hr class="dropdown-divider" /></li>
                        {% endfor %}
                    </ul>
                </li>
            </ul>
            <form class="d-flex" >
                <button class="btn btn-outline-dark" type="submit">
                    <a class="text-black" href="{% url 'cart' %}" style="text-decoration: none">
                    <i class="bi-cart-fill me-1"></i>
                    Cart
                    <span class="badge bg-dark text-white ms-1 rounded-pill">{{ cart_product | length }}</span>
                    </a>
                </button>
            </form>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

{% endblock %}
